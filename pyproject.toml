[tool.poetry]
name = "aircraft-tracker"
version = "0.1.0"
description = ""
authors = ["Viktor Smirnov <tin.r@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.4.1"
isort = "^9.0.2"
mypy = "^2.3.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 119
skip = [".idea",".mypy_cache"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.idea, .mypy_cache'